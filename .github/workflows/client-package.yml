name: Client installer package

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bimmhacks Tuner tests
        run: |
          node idrive7-apps/kit/tools/test_bimmhacks_tuner.js
          node idrive7-apps/kit/tools/test_bimmhacks_pids.js
      - name: "Installer tests (fake car - coding snapshot + experimental restore, VIN, flash guards, root enable, PID capture, Pocket, Store sources, restart, no prompts)"
        run: |
          python -m pip install cryptography
          python installer/tests/test_coding_backup.py
          python installer/tests/test_coding_restore.py
          python tools/idrive7-8-ssh-root/tests/test_preflight.py
          python installer/tests/test_guards.py
          python installer/tests/test_root_enable.py
          python installer/tests/test_pid_capture.py
          python installer/tests/test_pocket.py
          python installer/tests/test_store_source.py
          python installer/tests/test_restart.py
          python installer/tests/test_noninteractive.py
      - name: "Store source-adding against the real mgu-updater (pinned commit)"
        run: |
          git init -q /tmp/mgu-store-src
          git -C /tmp/mgu-store-src fetch -q --depth 1 https://github.com/robertnisipeanu/mgu-store "$(cat installer/tests/MGU_STORE_COMMIT)"
          git -C /tmp/mgu-store-src checkout -q FETCH_HEAD
          MGU_STORE_SRC=/tmp/mgu-store-src python installer/tests/test_store_updater.py
      - name: Installer self-check
        run: |
          python installer/bimmhacks_installer.py --help >/dev/null
          python -m py_compile installer/bimmhacks_installer.py installer/make_client_package.py installer/coding_backup.py installer/pocket_server.py
      - name: Build the client zips (PC installer + Pocket box, separate releases)
        run: python installer/make_client_package.py
      - name: Check the zips have no BMW SDK, built apps, or client SSH keys
        run: |
          ! unzip -l dist/*.zip | grep -E 'oap-sdk/|\.mgu$|/enrollments/|/id_rsa( |$)'
      - name: Check the PC/Pocket split is clean
        run: |
          # the PC installer carries none of the Pocket box code, and does carry the Store-sources PDF
          ! unzip -l dist/Bimmhacks-MGU-Installer-*.zip | grep -iE 'pocket'
          unzip -l dist/Bimmhacks-MGU-Installer-*.zip | grep -q 'docs/Store-Sources.pdf'
          # the Pocket box carries the server, its page and its guide
          unzip -l dist/Bimmhacks-Pocket-*.zip | grep -q 'installer/pocket_server.py'
          unzip -l dist/Bimmhacks-Pocket-*.zip | grep -q 'installer/pocket/index.html'
          unzip -l dist/Bimmhacks-Pocket-*.zip | grep -q 'docs/POCKET.md'
      - uses: actions/upload-artifact@v4
        with:
          name: Bimmhacks-MGU-Installer
          path: dist/Bimmhacks-MGU-Installer-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bimmhacks-Pocket
          path: dist/Bimmhacks-Pocket-*.zip
