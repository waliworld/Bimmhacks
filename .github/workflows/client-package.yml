name: Client installer package

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bimmhacks Tuner tests
        run: |
          node idrive7-apps/kit/tools/test_bimmhacks_tuner.js
          node idrive7-apps/kit/tools/test_bimmhacks_pids.js
      - name: "Installer tests (fake car - coding snapshot, VIN, flash guards, root enable, PID capture, Pocket, Store sources, restart, no prompts)"
        run: |
          python -m pip install cryptography
          python installer/tests/test_coding_backup.py
          python installer/tests/test_guards.py
          python installer/tests/test_root_enable.py
          python installer/tests/test_pid_capture.py
          python installer/tests/test_pocket.py
          python installer/tests/test_store_source.py
          python installer/tests/test_restart.py
          python installer/tests/test_noninteractive.py
      - name: "Store source-adding against the real mgu-updater (pinned commit)"
        run: |
          git init -q /tmp/mgu-store-src
          git -C /tmp/mgu-store-src fetch -q --depth 1 https://github.com/robertnisipeanu/mgu-store "$(cat installer/tests/MGU_STORE_COMMIT)"
          git -C /tmp/mgu-store-src checkout -q FETCH_HEAD
          MGU_STORE_SRC=/tmp/mgu-store-src python installer/tests/test_store_updater.py
      - name: Installer self-check
        run: |
          python installer/bimmhacks_installer.py apps
          python -m py_compile installer/bimmhacks_installer.py installer/make_client_package.py
      - name: Build the client zip
        run: python installer/make_client_package.py
      - name: Check the zip has no BMW SDK, built apps, or client SSH keys
        run: |
          ! unzip -l dist/*.zip | grep -E 'oap-sdk/|\.mgu$|/enrollments/|/id_rsa( |$)'
      - uses: actions/upload-artifact@v4
        with:
          name: Bimmhacks-MGU-Installer
          path: dist/*.zip
